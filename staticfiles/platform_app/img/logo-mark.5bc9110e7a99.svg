<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mirrorwavetrades logo">
  <defs>
    <linearGradient id="mwt-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="mwt-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#mwt-bg)"/>

  <!-- mirror axis -->
  <line x1="10" y1="33" x2="54" y2="33" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round"/>

  <!-- reflected (mirrored) wave, beneath the axis -->
  <polyline points="14,36 22,44 30,40 38,50 50,46"
            fill="none" stroke="#ffffff" stroke-opacity="0.3"
            stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- primary trend wave, above the axis -->
  <polyline points="14,30 22,22 30,26 38,16 50,20"
            fill="none" stroke="#ffffff"
            stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#mwt-glow)"/>

  <!-- accent dot at the trend's leading point -->
  <circle cx="50" cy="20" r="3.4" fill="#ffffff" filter="url(#mwt-glow)"/>
</svg>
