<!-- 403.html - Forbidden -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden | InfinityinfluxTrading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .gradient-text {
            background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center max-w-2xl">
            <!-- Icon -->
            <div class="mb-8 shake">
                <i class="fas fa-lock text-9xl text-red-500 opacity-50"></i>
            </div>
            
            <!-- Error Code -->
            <h1 class="text-9xl font-black mb-4">
                <span class="gradient-text">403</span>
            </h1>
            
            <!-- Message -->
            <h2 class="text-3xl md:text-4xl font-bold mb-4">Access Forbidden</h2>
            <p class="text-gray-400 text-lg mb-8">
                You don't have permission to access this resource. This area is restricted.
            </p>
            
            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/" class="px-8 py-4 bg-gradient-to-r from-red-600 to-orange-600 rounded-lg font-semibold hover:from-red-700 hover:to-orange-700 transition">
                    <i class="fas fa-home mr-2"></i>Go Home
                </a>
                <a href="javascript:history.back()" class="px-8 py-4 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition">
                    <i class="fas fa-arrow-left mr-2"></i>Go Back
                </a>
            </div>
            
            <!-- Additional Info -->
            <div class="mt-12 p-4 bg-red-900/20 border border-red-500/30 rounded-lg">
                <p class="text-sm text-red-400">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    If you believe this is an error, please contact support
                </p>
            </div>
            
            <div class="mt-4 text-sm text-gray-500">
                <p>Error Code: 403 | Forbidden</p>
            </div>
        </div>
    </div>
</body>
</html>
