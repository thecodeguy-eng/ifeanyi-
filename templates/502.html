{% extends 'base.html' %}
{% block title %}502 - Bad Gateway | Mirrorwavetrades{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4" style="padding-top:4rem; padding-bottom:4rem;">
    <div class="text-center max-w-2xl">
        <div class="mb-8">
            <i class="fas fa-network-wired text-8xl" style="color:#a855f7; opacity:.5;"></i>
        </div>

        <h1 class="text-8xl font-black mb-4 gradient-text-502">502</h1>

        <h2 class="text-2xl md:text-3xl font-bold mb-4">Bad Gateway</h2>
        <p style="color:var(--text-muted);" class="text-base mb-8">
            We're having trouble connecting to our servers. Please try again shortly.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="btn-primary px-8 py-3.5 rounded-lg font-semibold text-sm text-white">
                <i class="fas fa-home mr-2"></i>Go Home
            </a>
            <button onclick="location.reload()" class="px-8 py-3.5 rounded-lg font-semibold text-sm text-white" style="background:rgba(255,255,255,.08); border:1px solid var(--border);">
                <i class="fas fa-redo mr-2"></i>Retry
            </button>
        </div>

        <div class="mt-10 text-xs" style="color:var(--text-light);">
            <p>Error Code: 502 · Bad Gateway</p>
        </div>
    </div>
</div>

<style>
.gradient-text-502 {
    background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
</style>
{% endblock %}
