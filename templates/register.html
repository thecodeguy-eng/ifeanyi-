{% extends 'base.html' %}

{% block title %}Create Account - InfinityinfluxTrading{% endblock %}

{% block content %}
<section class="min-h-screen py-20">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="crypto-card p-8 md:p-12 rounded-3xl">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold mb-2">
                    Create Your <span class="gradient-text">Account</span>
                </h1>
                <p class="text-gray-400">Join thousands of successful traders</p>
            </div>
            
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium mb-2">Username</label>
                    <input type="text" name="username" required
                           class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition">
                </div>
                
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium mb-2">Email Address</label>
                    <input type="email" name="email" required
                           class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition">
                </div>
                
                <!-- Name Fields -->
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Legal First Name</label>
                        <input type="text" name="legal_first_name" required
                               class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Legal Last Name</label>
                        <input type="text" name="legal_last_name" required
                               class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition">
                    </div>
                </div>
                
                <!-- Phone Number -->
                <div>
                    <label class="block text-sm font-medium mb-2">Phone Number</label>
                    <input type="tel" name="phone_number" required
                           class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition"
                           placeholder="+1234567890">
                </div>
                
                <!-- Preferred Currency -->
                <div>
                    <label class="block text-sm font-medium mb-2">Preferred Currency</label>
                    <select name="preferred_currency" required
                            class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition">
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="NGN">NGN - Nigerian Naira</option>
                    </select>
                </div>
                
                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition"
                           placeholder="Minimum 8 characters">
                </div>
                
                <!-- Terms -->
                <div class="flex items-start">
                    <input type="checkbox" required class="mt-1 mr-3">
                    <label class="text-sm text-gray-400">
                        I agree to the <a href="#" class="text-cyan-400 hover:underline">Terms of Service</a> and 
                        <a href="#" class="text-cyan-400 hover:underline">Privacy Policy</a>
                    </label>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="w-full btn-primary py-4 rounded-lg font-bold text-lg">
                    Create Account <i class="fas fa-arrow-right ml-2"></i>
                </button>
                
                <div class="text-center text-gray-400">
                    Already have an account? 
                    <a href="{% url 'login' %}" class="text-cyan-400 hover:underline font-semibold">Sign In</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
