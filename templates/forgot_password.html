{% extends 'base.html' %}

{% block title %}Forgot Password - InfinityinfluxTrading{% endblock %}

{% block content %}
<section class="min-h-screen py-20 flex items-center">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="crypto-card p-8 md:p-12 rounded-3xl">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-gradient-to-br from-blue-500/20 to-cyan-500/20 rounded-2xl mb-4">
                    <i class="fas fa-key text-5xl gradient-text"></i>
                </div>
                <h1 class="text-4xl font-bold mb-2">
                    Forgot Password?
                </h1>
                <p class="text-gray-400">No worries! We'll send you a reset code</p>
            </div>
            
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" name="email" required
                               class="w-full pl-12 pr-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition"
                               placeholder="Enter your registered email">
                    </div>
                    <p class="text-sm text-gray-400 mt-2">
                        We'll send a 6-digit code to this email
                    </p>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="w-full btn-primary py-4 rounded-lg font-bold text-lg">
                    Send Reset Code <i class="fas fa-paper-plane ml-2"></i>
                </button>
                
                <div class="text-center space-y-2">
                    <a href="{% url 'login' %}" class="text-cyan-400 hover:underline text-sm block">
                        <i class="fas fa-arrow-left mr-2"></i> Back to Login
                    </a>
                    <p class="text-gray-400 text-sm">
                        Don't have an account? 
                        <a href="{% url 'register' %}" class="text-cyan-400 hover:underline font-semibold">Sign Up</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
