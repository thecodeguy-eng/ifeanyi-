{% extends 'base.html' %}

{% block title %}Login - Influxfinancetrading {% endblock %}

{% block content %}
<section class="min-h-screen flex items-center py-20" style="background: var(--bg-secondary);">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="glass-card rounded-2xl p-8 md:p-12">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4" style="background: rgba(16, 185, 129, 0.1);">
                    <i class="fas fa-user-circle text-emerald-600 text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold mb-2" style="color: var(--text-primary);">
                    Welcome Back
                </h1>
                <p style="color: var(--text-secondary);">Sign in to continue trading</p>
            </div>
            
            <form method="post" class="space-y-5" id="loginForm">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm font-semibold mb-2" style="color: var(--text-primary);">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-envelope" style="color: var(--text-tertiary);"></i>
                        </div>
                        <input type="email" name="email" required
                               class="w-full pl-12 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
                               style="background: var(--bg-tertiary); border-color: var(--border-color); color: var(--text-primary);"
                               placeholder="you@example.com">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-2" style="color: var(--text-primary);">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock" style="color: var(--text-tertiary);"></i>
                        </div>
                        <input type="password" name="password" id="password" required
                               class="w-full pl-12 pr-12 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
                               style="background: var(--bg-tertiary); border-color: var(--border-color); color: var(--text-primary);"
                               placeholder="Enter your password">
                        <button type="button" onclick="togglePassword()" 
                                class="absolute inset-y-0 right-0 pr-4 flex items-center hover:text-emerald-600"
                                style="color: var(--text-tertiary);">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                
                <!-- CAPTCHA Container -->
                <div id="captchaContainer" class="hidden">
                    <div class="border rounded-lg p-4" style="background: var(--bg-tertiary); border-color: var(--border-color);">
                        <label class="block text-sm font-semibold mb-3" style="color: var(--text-primary);">
                            <i class="fas fa-shield-alt text-blue-500 mr-2"></i>
                            Verify you're human
                        </label>
                        <div class="flex items-center gap-4">
                            <div id="captchaQuestion" class="text-lg font-bold p-4 rounded-lg text-center flex-1" style="background: var(--bg-secondary); color: var(--text-primary);">
                                <!-- CAPTCHA question will appear here -->
                            </div>
                            <input type="number" id="captchaAnswer" 
                                   class="w-24 px-4 py-3 text-center text-lg font-bold border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   style="background: var(--bg-tertiary); border-color: var(--border-color); color: var(--text-primary);"
                                   placeholder="?" required>
                        </div>
                        <button type="button" onclick="generateCaptcha()" class="text-sm text-blue-500 hover:text-blue-600 mt-2">
                            <i class="fas fa-sync-alt mr-1"></i> Generate new puzzle
                        </button>
                    </div>
                </div>
                
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500" style="border-color: var(--border-color);">
                        <span class="ml-2" style="color: var(--text-secondary);">Remember me</span>
                    </label>
                    <a href="{% url 'forgot_password' %}" class="text-emerald-600 hover:text-emerald-700 font-semibold">
                        Forgot password?
                    </a>
                </div>
                
                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-lg hover:shadow-xl transition-all">
                    Sign In
                </button>
                
                <div class="text-center text-sm" style="color: var(--text-secondary);">
                    Don't have an account? 
                    <a href="{% url 'register' %}" class="text-emerald-600 hover:text-emerald-700 font-bold">Create one</a>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
    let captchaAnswer = null;
    let captchaShown = false;
    
    function generateCaptcha() {
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const operations = ['+', '-', '*'];
        const operation = operations[Math.floor(Math.random() * operations.length)];
        
        let answer;
        switch(operation) {
            case '+':
                answer = num1 + num2;
                break;
            case '-':
                answer = num1 - num2;
                break;
            case '*':
                answer = num1 * num2;
                break;
        }
        
        captchaAnswer = answer;
        document.getElementById('captchaQuestion').innerHTML = `${num1} ${operation} ${num2} = ?`;
        document.getElementById('captchaAnswer').value = '';
    }
    
    function togglePassword() {
        const passwordField = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordField.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    }
    
    // Show CAPTCHA on first interaction with form
    document.getElementById('loginForm').addEventListener('focus', function(e) {
        if (!captchaShown && (e.target.name === 'email' || e.target.name === 'password')) {
            captchaShown = true;
            document.getElementById('captchaContainer').classList.remove('hidden');
            generateCaptcha();
        }
    }, true);
    
    // Validate CAPTCHA before submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        if (captchaShown) {
            const userAnswer = parseInt(document.getElementById('captchaAnswer').value);
            if (userAnswer !== captchaAnswer) {
                e.preventDefault();
                alert('❌ CAPTCHA verification failed. Please solve the puzzle correctly.');
                generateCaptcha();
                return false;
            }
        }
    });
</script>
{% endblock %}
