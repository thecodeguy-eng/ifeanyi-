{% extends 'base.html' %}

{% block title %}Login - Mirrorwavetrades{% endblock %}

{% block extra_css %}
<style>
.auth-input {
    width: 100%;
    padding: 0.7rem 1rem 0.7rem 2.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    color: var(--text-main);
    background: rgba(255,255,255,.04);
    transition: all 0.2s ease;
    font-family: 'Poppins', sans-serif;
}
.auth-input:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(255,255,255,.07);
}
.auth-input::placeholder { color: var(--text-light); }
</style>
{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center py-16" style="background: var(--bg);">
    <div class="max-w-md mx-auto px-4 w-full">
        <div class="bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl p-8 md:p-10 shadow-[0_20px_60px_rgba(0,0,0,.4)]">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-white/5 border border-[var(--border)] mb-4">
                    <i class="fas fa-user text-[var(--accent-light)] text-xl"></i>
                </div>
                <h1 class="title-font text-2xl text-white mb-1">Welcome Back</h1>
                <p class="text-[var(--text-muted)] text-sm">Sign in to continue trading</p>
            </div>

            <form method="post" class="space-y-5" id="loginForm">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1.5">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-light)] text-sm"></i>
                        <input type="email" name="email" required class="auth-input" placeholder="you@example.com">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1.5">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-light)] text-sm"></i>
                        <input type="password" name="password" id="password" required class="auth-input" placeholder="Enter your password">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--text-light)] hover:text-white">
                            <i class="fas fa-eye text-sm" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- CAPTCHA -->
                <div id="captchaContainer" class="hidden">
                    <div class="border border-[var(--border)] rounded-lg p-4 bg-white/5">
                        <label class="block text-sm font-medium text-[var(--text-muted)] mb-3">
                            <i class="fas fa-shield-alt text-[var(--accent)] mr-1.5"></i>Verify you're human
                        </label>
                        <div class="flex items-center gap-3">
                            <div id="captchaQuestion" class="text-base font-bold px-4 py-2.5 rounded-lg bg-[var(--bg-elevated)] border border-[var(--border)] text-center flex-1 text-white"></div>
                            <input type="number" id="captchaAnswer"
                                class="w-20 px-3 py-2.5 text-center text-base font-bold border border-[var(--border)] rounded-lg focus:outline-none focus:border-[var(--accent)] bg-[var(--bg-elevated)] text-white"
                                placeholder="?" required>
                        </div>
                        <button type="button" onclick="generateCaptcha()" class="text-xs text-[var(--accent-light)] hover:text-white mt-2">
                            <i class="fas fa-sync-alt mr-1"></i>New puzzle
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-white/20 accent-blue-600">
                        <span class="text-[var(--text-muted)]">Remember me</span>
                    </label>
                    <!-- <a href="{% url 'forgot_password' %}" class="text-gray-700 font-medium hover:text-gray-900">Forgot password?</a> -->
                    <a href="#" class="text-[var(--text-muted)] font-medium hover:text-white">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-lg text-sm font-semibold">
                    Sign In
                </button>

                <p class="text-center text-sm text-[var(--text-muted)]">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="text-[var(--accent-light)] font-semibold hover:text-white">Create one</a>
                </p>
            </form>
        </div>
    </div>
</section>

<script>
let captchaAnswer = null, captchaShown = false;

function generateCaptcha() {
    const n1 = Math.floor(Math.random()*10)+1, n2 = Math.floor(Math.random()*10)+1;
    const ops = ['+','-','*'], op = ops[Math.floor(Math.random()*ops.length)];
    const answers = {'+': n1+n2, '-': n1-n2, '*': n1*n2};
    captchaAnswer = answers[op];
    document.getElementById('captchaQuestion').textContent = `${n1} ${op} ${n2} = ?`;
    document.getElementById('captchaAnswer').value = '';
}

function togglePassword() {
    const f = document.getElementById('password'), i = document.getElementById('toggleIcon');
    f.type = f.type === 'password' ? 'text' : 'password';
    i.classList.toggle('fa-eye'); i.classList.toggle('fa-eye-slash');
}

document.getElementById('loginForm').addEventListener('focus', function(e) {
    if (!captchaShown && (e.target.name === 'email' || e.target.name === 'password')) {
        captchaShown = true;
        document.getElementById('captchaContainer').classList.remove('hidden');
        generateCaptcha();
    }
}, true);

document.getElementById('loginForm').addEventListener('submit', function(e) {
    if (captchaShown && parseInt(document.getElementById('captchaAnswer').value) !== captchaAnswer) {
        e.preventDefault();
        alert('CAPTCHA verification failed. Please solve the puzzle correctly.');
        generateCaptcha();
    }
});
</script>
{% endblock %}
