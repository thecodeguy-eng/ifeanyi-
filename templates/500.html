<!-- 500.html - Internal Server Error -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Mirrorwavetrades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .gradient-text {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glitch {
            animation: glitch 1s linear infinite;
        }
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center max-w-2xl">
            <!-- Icon -->
            <div class="mb-8">
                <i class="fas fa-server glitch text-9xl text-yellow-500 opacity-50"></i>
            </div>
            
            <!-- Error Code -->
            <h1 class="text-9xl font-black mb-4">
                <span class="gradient-text">500</span>
            </h1>
            
            <!-- Message -->
            <h2 class="text-3xl md:text-4xl font-bold mb-4">Internal Server Error</h2>
            <p class="text-gray-400 text-lg mb-8">
                Something went wrong on our end. Our team has been notified and we're working on it!
            </p>
            
            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/" class="px-8 py-4 bg-gradient-to-r from-yellow-600 to-red-600 rounded-lg font-semibold hover:from-yellow-700 hover:to-red-700 transition">
                    <i class="fas fa-home mr-2"></i>Go Home
                </a>
                <button onclick="location.reload()" class="px-8 py-4 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition">
                    <i class="fas fa-redo mr-2"></i>Try Again
                </button>
            </div>
            
            <!-- Additional Info -->
            <div class="mt-12 p-4 bg-yellow-900/20 border border-yellow-500/30 rounded-lg">
                <p class="text-sm text-yellow-400">
                    <i class="fas fa-tools mr-2"></i>
                    We apologize for the inconvenience. Please try again in a few moments.
                </p>
            </div>
            
            <div class="mt-4 text-sm text-gray-500">
                <p>Error Code: 500 | Internal Server Error</p>
            </div>
        </div>
    </div>
</body>
</html>
