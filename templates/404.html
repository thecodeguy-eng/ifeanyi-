<!-- 404.html - Page Not Found -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Mirrorwavetrades</title>
    <link rel="icon" type="image/svg+xml" href="/static/platform_app/img/logo-mark.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #05070a 0%, #0b0f17 100%);
            min-height: 100vh;
        }
        .gradient-text {
            background: linear-gradient(135deg, #2563eb 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .btn-primary { background: #2563eb; transition: background .2s; }
        .btn-primary:hover { background: #1d4ed8; }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center max-w-2xl">
            <a href="/" class="inline-flex items-center gap-2 mb-10 opacity-80 hover:opacity-100 transition">
                <img src="/static/platform_app/img/logo-mark.svg" alt="Mirrorwavetrades" class="w-8 h-8 rounded-lg">
                <span class="font-bold text-sm">Mirrorwavetrades</span>
            </a>

            <div class="mb-8 floating">
                <i class="fas fa-search text-8xl text-cyan-400 opacity-50"></i>
            </div>

            <h1 class="text-8xl font-black mb-4">
                <span class="gradient-text">404</span>
            </h1>

            <h2 class="text-2xl md:text-3xl font-bold mb-4">Page Not Found</h2>
            <p class="text-gray-400 text-base mb-8">
                Oops! The page you're looking for seems to have vanished into the crypto void.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="/" class="btn-primary px-8 py-3.5 rounded-lg font-semibold text-sm text-white">
                    <i class="fas fa-home mr-2"></i>Go Home
                </a>
                <a href="javascript:history.back()" class="px-8 py-3.5 rounded-lg font-semibold text-sm text-white" style="background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);">
                    <i class="fas fa-arrow-left mr-2"></i>Go Back
                </a>
            </div>

            <div class="mt-10 text-xs text-gray-600">
                <p>Error Code: 404 · Page Not Found</p>
            </div>
        </div>
    </div>
</body>
</html>
