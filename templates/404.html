{% extends 'base.html' %}
{% block title %}404 - Page Not Found | Mirrorwavetrades{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4" style="padding-top:4rem; padding-bottom:4rem;">
    <div class="text-center max-w-2xl">
        <div class="mb-8 floating-err">
            <i class="fas fa-search text-8xl" style="color:var(--accent); opacity:.5;"></i>
        </div>

        <h1 class="text-8xl font-black mb-4 gradient-text-404">404</h1>

        <h2 class="text-2xl md:text-3xl font-bold mb-4">Page Not Found</h2>
        <p style="color:var(--text-muted);" class="text-base mb-8">
            Oops! The page you're looking for seems to have vanished into the crypto void.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="btn-primary px-8 py-3.5 rounded-lg font-semibold text-sm text-white">
                <i class="fas fa-home mr-2"></i>Go Home
            </a>
            <a href="javascript:history.back()" class="px-8 py-3.5 rounded-lg font-semibold text-sm text-white" style="background:rgba(255,255,255,.08); border:1px solid var(--border);">
                <i class="fas fa-arrow-left mr-2"></i>Go Back
            </a>
        </div>

        <div class="mt-10 text-xs" style="color:var(--text-light);">
            <p>Error Code: 404 · Page Not Found</p>
        </div>
    </div>
</div>

<style>
.gradient-text-404 {
    background: linear-gradient(135deg, #2563eb 0%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.floating-err { animation: floatingErr 3s ease-in-out infinite; }
@keyframes floatingErr {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
}
</style>
{% endblock %}
