<!-- 503.html - Service Unavailable -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 - Service Unavailable | Mirrorwavetrades</title>
    <link rel="icon" type="image/svg+xml" href="/static/platform_app/img/logo-mark.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #05070a 0%, #0b0f17 100%);
            min-height: 100vh;
        }
        .gradient-text {
            background: linear-gradient(135deg, #14b8a6 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .blink { animation: blink 2s linear infinite; }
        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }
        .btn-primary { background: #2563eb; transition: background .2s; }
        .btn-primary:hover { background: #1d4ed8; }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center max-w-2xl">
            <a href="/" class="inline-flex items-center gap-2 mb-10 opacity-80 hover:opacity-100 transition">
                <img src="/static/platform_app/img/logo-mark.svg" alt="Mirrorwavetrades" class="w-8 h-8 rounded-lg">
                <span class="font-bold text-sm">Mirrorwavetrades</span>
            </a>

            <div class="mb-8">
                <i class="fas fa-wrench blink text-8xl text-teal-500 opacity-50"></i>
            </div>

            <h1 class="text-8xl font-black mb-4">
                <span class="gradient-text">503</span>
            </h1>

            <h2 class="text-2xl md:text-3xl font-bold mb-4">Service Unavailable</h2>
            <p class="text-gray-400 text-base mb-8">
                We're performing scheduled maintenance. We'll be back online shortly!
            </p>

            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="/" class="btn-primary px-8 py-3.5 rounded-lg font-semibold text-sm text-white">
                    <i class="fas fa-home mr-2"></i>Go Home
                </a>
                <button onclick="location.reload()" class="px-8 py-3.5 rounded-lg font-semibold text-sm text-white" style="background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);">
                    <i class="fas fa-redo mr-2"></i>Check Status
                </button>
            </div>

            <div class="mt-10 p-4 rounded-lg" style="background:rgba(20,184,166,.08); border:1px solid rgba(20,184,166,.25);">
                <p class="text-sm text-teal-400">
                    <i class="fas fa-clock mr-2"></i>
                    Estimated downtime: a few minutes.
                </p>
            </div>

            <div class="mt-5 text-xs text-gray-600">
                <p>Error Code: 503 · Service Unavailable</p>
            </div>
        </div>
    </div>
</body>
</html>
