<!-- 503.html - Service Unavailable -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 - Service Unavailable | InfinityinfluxTrading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .gradient-text {
            background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .blink {
            animation: blink 2s linear infinite;
        }
        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center max-w-2xl">
            <div class="mb-8">
                <i class="fas fa-wrench blink text-9xl text-teal-500 opacity-50"></i>
            </div>
            
            <h1 class="text-9xl font-black mb-4">
                <span class="gradient-text">503</span>
            </h1>
            
            <h2 class="text-3xl md:text-4xl font-bold mb-4">Service Unavailable</h2>
            <p class="text-gray-400 text-lg mb-8">
                We're performing scheduled maintenance. We'll be back online shortly!
            </p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/" class="px-8 py-4 bg-gradient-to-r from-teal-600 to-cyan-600 rounded-lg font-semibold hover:from-teal-700 hover:to-cyan-700 transition">
                    <i class="fas fa-home mr-2"></i>Go Home
                </a>
                <button onclick="location.reload()" class="px-8 py-4 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition">
                    <i class="fas fa-redo mr-2"></i>Check Status
                </button>
            </div>
            
            <div class="mt-12 p-4 bg-teal-900/20 border border-teal-500/30 rounded-lg">
                <p class="text-sm text-teal-400">
                    <i class="fas fa-clock mr-2"></i>
                    Estimated downtime: A few minutes
                </p>
            </div>
            
            <div class="mt-4 text-sm text-gray-500">
                <p>Error Code: 503 | Service Unavailable</p>
            </div>
        </div>
    </div>
</body>
</html>
