{% extends 'base.html' %}
{% block title %}Verify Reset Code - Influxfinancetrading{% endblock %}
{% block content %}
<section class="min-h-screen flex items-center py-16" style="background:#f8f9fb;">
    <div class="max-w-md mx-auto px-4 w-full">
        <div class="bg-white border border-gray-200 rounded-2xl p-8 md:p-10 shadow-sm">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gray-100 mb-4">
                    <i class="fas fa-shield-alt text-gray-600 text-xl"></i>
                </div>
                <h1 class="title-font text-2xl text-gray-900 mb-1">Enter Reset Code</h1>
                <p class="text-gray-500 text-sm">
                    We've sent a 6-digit code to<br>
                    <span class="font-semibold text-gray-700">{{ masked_email }}</span>
                </p>
            </div>

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5 text-center">6-Digit Code</label>
                    <input type="text" name="code" id="codeInput" maxlength="6" required pattern="[0-9]{6}"
                        class="w-full px-4 py-4 border border-gray-200 rounded-lg focus:outline-none focus:border-gray-400 bg-gray-50 text-center text-3xl font-bold tracking-widest text-gray-900 transition"
                        placeholder="000000" autocomplete="off">
                    <div class="flex items-center justify-center gap-1.5 mt-2">
                        <i class="fas fa-clock text-amber-500 text-xs"></i>
                        <p class="text-xs text-amber-600">Code expires in 15 minutes</p>
                    </div>
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-lg text-sm font-semibold">
                    Verify Code <i class="fas fa-check-circle ml-1.5"></i>
                </button>

                <div class="text-center space-y-2">
                    <p class="text-sm text-gray-500">Didn't receive the code?</p>
                    <a href="{% url 'resend_reset_code' %}" class="text-sm text-gray-700 font-semibold hover:underline">
                        <i class="fas fa-redo mr-1.5"></i>Resend Code
                    </a>
                    <div class="pt-2 border-t border-gray-100">
                        <a href="{% url 'forgot_password' %}" class="text-sm text-gray-400 hover:text-gray-600">
                            <i class="fas fa-arrow-left mr-1.5"></i>Start Over
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('codeInput');
    input.focus();
    input.addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });
});
</script>
{% endblock %}
