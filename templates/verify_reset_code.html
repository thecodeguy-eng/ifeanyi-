{% extends 'base.html' %}
{% block title %}Verify Reset Code - Mirrorwavetrades{% endblock %}
{% block content %}
<section class="min-h-screen flex items-center py-16" style="background:var(--bg);">
    <div class="max-w-md mx-auto px-4 w-full">
        <div class="bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl p-8 md:p-10 shadow-[0_20px_60px_rgba(0,0,0,.4)]">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-white/5 border border-[var(--border)] mb-4">
                    <i class="fas fa-shield-alt text-[var(--accent-light)] text-xl"></i>
                </div>
                <h1 class="title-font text-2xl text-white mb-1">Enter Reset Code</h1>
                <p class="text-[var(--text-muted)] text-sm">
                    We've sent a 6-digit code to<br>
                    <span class="font-semibold text-white">{{ masked_email }}</span>
                </p>
            </div>

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1.5 text-center">6-Digit Code</label>
                    <input type="text" name="code" id="codeInput" maxlength="6" required pattern="[0-9]{6}"
                        class="w-full px-4 py-4 border border-[var(--border)] rounded-lg focus:outline-none focus:border-[var(--accent)] bg-white/5 text-center text-3xl font-bold tracking-widest text-white transition"
                        placeholder="000000" autocomplete="off">
                    <div class="flex items-center justify-center gap-1.5 mt-2">
                        <i class="fas fa-clock text-amber-400 text-xs"></i>
                        <p class="text-xs text-amber-400">Code expires in 15 minutes</p>
                    </div>
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-lg text-sm font-semibold">
                    Verify Code <i class="fas fa-check-circle ml-1.5"></i>
                </button>

                <div class="text-center space-y-2">
                    <p class="text-sm text-[var(--text-muted)]">Didn't receive the code?</p>
                    <a href="{% url 'resend_reset_code' %}" class="text-sm text-[var(--accent-light)] font-semibold hover:text-white hover:underline">
                        <i class="fas fa-redo mr-1.5"></i>Resend Code
                    </a>
                    <div class="pt-2 border-t border-[var(--border)]">
                        <a href="{% url 'forgot_password' %}" class="text-sm text-[var(--text-light)] hover:text-white">
                            <i class="fas fa-arrow-left mr-1.5"></i>Start Over
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('codeInput');
    input.focus();
    input.addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });
});
</script>
{% endblock %}
