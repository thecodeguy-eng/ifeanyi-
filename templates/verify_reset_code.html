{% extends 'base.html' %}

{% block title %}Verify Reset Code - InfinityinfluxTrading{% endblock %}

{% block content %}
<section class="min-h-screen py-20 flex items-center">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="crypto-card p-8 md:p-12 rounded-3xl">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-gradient-to-br from-blue-500/20 to-cyan-500/20 rounded-2xl mb-4">
                    <i class="fas fa-shield-alt text-5xl gradient-text"></i>
                </div>
                <h1 class="text-4xl font-bold mb-2">
                    Enter Reset Code
                </h1>
                <p class="text-gray-400">
                    We've sent a 6-digit code to<br>
                    <span class="text-cyan-400 font-semibold">{{ masked_email }}</span>
                </p>
            </div>
            
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                <!-- Reset Code Input -->
                <div>
                    <label class="block text-sm font-medium mb-2 text-center">Enter 6-Digit Code</label>
                    <div class="relative">
                        <input type="text" 
                               name="code" 
                               id="codeInput"
                               maxlength="6" 
                               required
                               pattern="[0-9]{6}"
                               class="w-full px-4 py-4 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-500 transition text-center text-3xl font-bold tracking-widest"
                               placeholder="000000"
                               autocomplete="off">
                    </div>
                    <div class="flex items-center justify-center mt-3 space-x-2">
                        <i class="fas fa-clock text-yellow-400"></i>
                        <p class="text-sm text-yellow-400">
                            Code expires in 15 minutes
                        </p>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="w-full btn-primary py-4 rounded-lg font-bold text-lg">
                    Verify Code <i class="fas fa-check-circle ml-2"></i>
                </button>
                
                <!-- Resend Code -->
                <div class="text-center space-y-3">
                    <p class="text-gray-400 text-sm">
                        Didn't receive the code?
                    </p>
                    <a href="{% url 'resend_reset_code' %}" 
                       class="inline-block text-cyan-400 hover:underline font-semibold">
                        <i class="fas fa-redo mr-2"></i> Resend Code
                    </a>
                    <div class="pt-2 border-t border-slate-700">
                        <a href="{% url 'forgot_password' %}" class="text-gray-400 hover:text-cyan-400 text-sm">
                            <i class="fas fa-arrow-left mr-2"></i> Start Over
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
    // Auto-focus on code input
    document.addEventListener('DOMContentLoaded', function() {
        const codeInput = document.getElementById('codeInput');
        codeInput.focus();
        
        // Only allow numbers
        codeInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
        
        // Auto-submit when 6 digits entered (optional)
        codeInput.addEventListener('input', function(e) {
            if (this.value.length === 6) {
                // Optional: auto-submit form
                // this.form.submit();
            }
        });
    });
</script>
{% endblock %}
